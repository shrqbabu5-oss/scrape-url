name: Replit Auto Start

on:
  workflow_dispatch:
  schedule:
    # 0 * * * * = Har 1 ghante (60 min) me automatically run hoga
    - cron: '0 * * * *'

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Test Repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "Install Xvfb Virtual Display & System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libatk-bridge2.0-0 libgtk-3-0

      - name: "Restore / Save Chrome Profile"
        uses: actions/cache@v4
        with:
          path: runner/profile
          key: replit-chrome-profile-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            replit-chrome-profile-${{ runner.os }}-

      - name: "Install Scraper Dependencies"
        working-directory: ./runner
        run: |
          npm install

      - name: "Run Real Chrome Scraper on Xvfb"
        working-directory: ./runner
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper_test.js

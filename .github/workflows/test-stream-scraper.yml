name: Replit Auto Start

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Har 60 min UTC

jobs:
  test-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libatk-bridge2.0-0 libgtk-3-0
      
      - name: "Restore / Save Chrome Profile"
        uses: actions/cache@v4
        with:
          path: profile
          key: replit-chrome-profile-${{ runner.os }}-v1
          restore-keys: |
            replit-chrome-profile-${{ runner.os }}-

      - run: npm install

      - name: "Run Real Chrome Scraper on Xvfb"
        env:
          BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scraper_test.js
